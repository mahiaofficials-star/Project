<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Attendance Tracker - Sign In</title>
  <link rel="stylesheet" href="styles/login.css">
</head>
<body>

  <!-- Header -->
  <header id="header">
    <div class="logo">
      <img src="logo.png" alt="Smart Attendance Logo">
      <h2>Smart Attendance Tracker</h2>
    </div>
    <div class="btn-group">
  <button class="btn1">Log In</button>
  <button class="btn2">Sign Up</button>
</div>

  </header>

  <!-- Sign In Section -->
  <section class="signin-section">
  <section class="text">
    <h1>Welcome Back</h1>
    <p>Sign in to continue tracking your attendance</p>
</section>
<br>
    <form class="signin-form">
      <fieldset>
       
        <label>Email Address:</label>
        <input required type="email" placeholder="Enter your email">

        <label>Password:</label>
        <input required type="password" placeholder="Enter your password">

        <button type="submit" class="submit-btn">Sign In</button>
      </fieldset>
    </form>
</section>
    <p class="alt-text">Don't have an account? <a href="signup.html">Sign Up</a></p>
  <script src="scripts/navigation.js"></script>


</body>
</html>
