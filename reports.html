<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Attendance Reports</title>
  <link rel="stylesheet" href="styles/reports.css">
</head>
<body>

  <!-- Navigation Bar -->
  <header class="navbar">
    <h2>Smart Attendance</h2>
    <nav>
      <a href="teacher-dash.html">Dashboard</a>
      <a href="create-session.html">Create Session</a>
      <a href="reports.html">Reports</a>
    </nav>
    <div class="user-info">
      <span>Teacher</span>
     <button class="logout-btn" id="logoutBtn">Logout</button>

    </div>
  </header>
<section class="re">
    <h1>Attendance Reports</h1>
    <p>Generate detailed attendance reports for any date range</p>
</section>
  <!-- Reports Section -->
  <section class="reports">
    
    

    <form id="reportForm">
      <label for="startDate">Start Date:</label>
      <input type="date" id="startDate" required>

      <label for="endDate">End Date:</label>
      <input type="date" id="endDate" required>

      <button type="submit" class="submit-btn">Generate Report</button>
    </form>

    <!-- Report Result -->
    
  </section>
<div id="reportResult" class="report-box">
      <p>No report generated yet.<br>Select a date range and generate a report to see results.</p>
    </div>
    <script src="scripts/logout.js"></script>

  <script src="scripts/reports.js"></script>
</body>
</html>
